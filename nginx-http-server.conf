# This file becomes /etc/nginx/conf.d/default.conf on the docker image,
# and is identical to the original ...default.conf on the nginx base image,
# except for the try_files directive, which lets React Router do the routing,
# and the cache headers below.

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    # Server level rather than inside `location /`, so the more specific
    # locations below inherit it. Without this they would fall back to nginx's
    # compiled-in default root and 404.
    root   /usr/share/nginx/html;
    index  index.html index.htm;

    #access_log  /var/log/nginx/host.access.log  main;

    # index.html names the hashed asset files, so a cached copy outlives the
    # deploy that replaced them and goes asking for chunks that no longer exist.
    # `no-cache` still stores it — it just has to revalidate, which is normally
    # a 304 rather than a refetch.
    #
    # Set here rather than only on `location = /index.html`, because try_files
    # below ends in `=404`, which makes /index.html a file path served by *this*
    # location rather than an internal redirect that would re-match. Every SPA
    # route (/dashboard, /technician_view/...) arrives that way, so the exact
    # match alone would miss the common case. The unhashed files also served
    # from here — favicon, logos — revalidate too, which is what you want for
    # names that can change content.
    location / {
        add_header Cache-Control "no-cache";
		try_files $uri $uri/ /index.html =404;
    }

    # Every name under /assets/ contains a content hash, so a given URL's bytes
    # never change. Safe to keep for a year without asking.
    #
    # `try_files $uri =404` deliberately does not fall back to index.html: a
    # missing hashed chunk is a real 404, and answering it with HTML instead
    # turns a clear failure into "expected a JavaScript module but got
    # text/html" at the point of import.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # proxy the PHP scripts to Apache listening on 127.0.0.1:80
    #
    #location ~ \.php$ {
    #    proxy_pass   http://127.0.0.1;
    #}

    # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
    #
    #location ~ \.php$ {
    #    root           html;
    #    fastcgi_pass   127.0.0.1:9000;
    #    fastcgi_index  index.php;
    #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
    #    include        fastcgi_params;
    #}

    # deny access to .htaccess files, if Apache's document root
    # concurs with nginx's one
    #
    #location ~ /\.ht {
    #    deny  all;
    #}
}

